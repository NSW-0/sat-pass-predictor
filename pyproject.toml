[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "satpass"
version = "0.1.0"
description = "Predict when a satellite passes over you and whether you can see it with the naked eye."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "skyfield>=1.45",
    "skyfield-data>=6.0",
    # Windows has no built-in time zone database, so zoneinfo needs this package.
    "tzdata; sys_platform == 'win32'",
]
keywords = ["astronomy", "satellite", "ISS", "orbit", "TLE", "SGP4"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Astronomy",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7", "matplotlib>=3.7"]

[project.scripts]
satpass = "satpass.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::RuntimeWarning:skyfield_data",
    "ignore::DeprecationWarning:skyfield",
]
